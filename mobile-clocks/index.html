<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="Clocks"/>
  <meta name="theme-color" content="#12110f"/>
  <title>Multi-city clocks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"/>
  <style>
    :root { --bg:#12110f; --card:#1a1815; --ink:#f3efe6; --muted:#a79f93; --line:#2e2b27; --accent:#e25a68; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font:16px/1.45 "IBM Plex Sans", system-ui, sans-serif; }
    body { padding: max(1rem, env(safe-area-inset-top)) 1rem 2rem; }
    h1 { margin:0; font-size:1.15rem; font-weight:600; letter-spacing:-0.02em; }
    .top { display:flex; justify-content:space-between; gap:1rem; align-items:flex-start; margin-bottom:1.25rem; }
    .hint { color:var(--muted); font-size:.85rem; max-width:22rem; }
    .grid { display:grid; gap:.75rem; grid-template-columns:1fr; }
    @media (min-width:560px) { .grid { grid-template-columns:1fr 1fr; } }
    .clock { background:var(--card); border:1px solid var(--line); border-radius:.5rem; padding:1rem 1.1rem; min-height:7.5rem; }
    .city { color:var(--muted); font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; }
    .time { font-variant-numeric: tabular-nums; font-size:clamp(2rem,7vw,2.75rem); font-weight:500; letter-spacing:.04em; margin:.35rem 0 .15rem; }
    .meta { color:var(--muted); font-size:.85rem; display:flex; justify-content:space-between; gap:.5rem; }
    .remove { background:none; border:0; color:var(--muted); min-height:2.5rem; padding:0; }
    .row { display:flex; gap:.5rem; margin-top:1.25rem; flex-wrap:wrap; }
    select, button.add { min-height:2.75rem; border-radius:.375rem; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:0 .8rem; font:inherit; }
    button.add { background:var(--ink); color:var(--bg); font-weight:500; }
    button:not(:disabled), [role=button] { cursor:pointer; }
  </style>
</head>
<body>
  <div class="top">
    <div>
      <h1 id="title">Multi-city clocks</h1>
      <p class="hint" id="hint">Choose the cities. Add this page to your phone home screen so the times stay visible while the phone is in use.</p>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <form class="row" id="addForm">
    <select id="citySelect" aria-label="City"></select>
    <button class="add" type="submit" id="addBtn">Add city</button>
  </form>
  <script>
    const CITIES = [
      ["Geneva", "Europe/Zurich"], ["Zurich", "Europe/Zurich"], ["Bern", "Europe/Zurich"],
      ["Paris", "Europe/Paris"], ["London", "Europe/London"], ["Dublin", "Europe/Dublin"],
      ["Berlin", "Europe/Berlin"], ["Rome", "Europe/Rome"], ["Madrid", "Europe/Madrid"],
      ["Indianapolis", "America/Indiana/Indianapolis"], ["New York", "America/New_York"],
      ["Chicago", "America/Chicago"], ["Toronto", "America/Toronto"], ["Los Angeles", "America/Los_Angeles"],
      ["Singapore", "Asia/Singapore"], ["Mumbai", "Asia/Kolkata"], ["Delhi", "Asia/Kolkata"],
      ["Tokyo", "Asia/Tokyo"], ["Shanghai", "Asia/Shanghai"], ["Hong Kong", "Asia/Hong_Kong"],
      ["Dubai", "Asia/Dubai"], ["Sydney", "Australia/Sydney"], ["Johannesburg", "Africa/Johannesburg"],
      ["Nairobi", "Africa/Nairobi"], ["Sao Paulo", "America/Sao_Paulo"]
    ];
    const COPY = {
      en: { title: "Multi-city clocks", hint: "Choose the cities. Add this page to your phone home screen so the times stay visible while the phone is in use.", add: "Add city", remove: "Remove" },
      fr: { title: "Horloges multi-villes", hint: "Choisissez les villes. Ajoutez cette page à l’écran d’accueil du téléphone pour que les heures restent visibles pendant l’utilisation.", add: "Ajouter une ville", remove: "Retirer" },
      de: { title: "Multi-City-Uhren", hint: "Wählen Sie die Städte. Legen Sie diese Seite auf den Startbildschirm, damit die Zeiten während der Nutzung sichtbar bleiben.", add: "Stadt hinzufügen", remove: "Entfernen" }
    };
    const lang = /lang=(fr|de)/.exec(location.search)?.[1] || "en";
    const t = COPY[lang] || COPY.en;
    document.documentElement.lang = lang;
    document.getElementById("title").textContent = t.title;
    document.getElementById("hint").textContent = t.hint;
    document.getElementById("addBtn").textContent = t.add;
    const KEY = "vg-mobile-clocks";
    const byName = Object.fromEntries(CITIES);
    function load() {
      try { const raw = JSON.parse(localStorage.getItem(KEY) || "[]"); if (Array.isArray(raw) && raw.length) return raw.filter((n) => byName[n]); } catch {}
      return ["Geneva", "Indianapolis", "Singapore"];
    }
    let selected = load();
    const select = document.getElementById("citySelect");
    function fillSelect() {
      select.innerHTML = "";
      CITIES.filter(([n]) => !selected.includes(n)).forEach(([n]) => {
        const o = document.createElement("option"); o.value = n; o.textContent = n; select.appendChild(o);
      });
      select.disabled = !CITIES.some(([n]) => !selected.includes(n));
    }
    const grid = document.getElementById("grid");
    const dateFmt = (zone) => new Intl.DateTimeFormat(lang === "de" ? "de-CH" : lang === "fr" ? "fr-CH" : "en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: zone });
    const timeFmt = (zone) => new Intl.DateTimeFormat(lang === "de" ? "de-CH" : lang === "fr" ? "fr-CH" : "en-GB", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false, timeZone: zone });
    const offsetFmt = (zone) => new Intl.DateTimeFormat("en-GB", { timeZoneName: "shortOffset", timeZone: zone, hour: "2-digit", minute: "2-digit" });
    function offset(zone) {
      const parts = offsetFmt(zone).formatToParts(new Date());
      return parts.find((p) => p.type === "timeZoneName")?.value || "";
    }
    function render() {
      grid.innerHTML = "";
      selected.forEach((name) => {
        const zone = byName[name];
        const el = document.createElement("article");
        el.className = "clock";
        el.innerHTML = `<div class="city">${name}</div><div class="time" data-zone="${zone}"></div><div class="meta"><span data-date="${zone}"></span><span>${offset(zone)}</span></div><button type="button" class="remove" data-name="${name}">${t.remove}</button>`;
        grid.appendChild(el);
      });
      fillSelect();
      tick();
    }
    function tick() {
      const now = new Date();
      grid.querySelectorAll("[data-zone]").forEach((node) => { node.textContent = timeFmt(node.dataset.zone).format(now); });
      grid.querySelectorAll("[data-date]").forEach((node) => { node.textContent = dateFmt(node.dataset.date).format(now); });
    }
    grid.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-name]");
      if (!btn || selected.length < 2) return;
      selected = selected.filter((n) => n !== btn.dataset.name);
      localStorage.setItem(KEY, JSON.stringify(selected));
      render();
    });
    document.getElementById("addForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = select.value;
      if (!name || selected.includes(name)) return;
      selected = [...selected, name];
      localStorage.setItem(KEY, JSON.stringify(selected));
      render();
    });
    render();
    setInterval(tick, 250);
  </script>
</body>
</html>
